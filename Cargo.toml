[package]
name = "sootmark-bits"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows BITS job queues for forensics: qmgr.db (Windows 10 and later) and qmgr0.dat/qmgr1.dat (XP to 8.1), each job's owner, files and the command it runs when done, and jobs carved from free space."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/bits"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "windows", "bits"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "bits"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
ese = { package = "sootmark-ese", version = "0.1.1" }

[dev-dependencies]
proptest = "1"

# The damage tests read the database hundreds of times: an optimised ESE
# reader and inflater keep them short.
[profile.dev.package.sootmark-ese]
opt-level = 3
[profile.dev.package.sootmark-common]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
